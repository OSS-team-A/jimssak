[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jimssak"
version = "0.1.0"
description = "Jimssak API and AI module contracts"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "pydantic[email]>=2.9,<3", "argon2-cffi>=23.1,<26"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10,<5", "numpy>=2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
