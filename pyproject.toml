[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jimssak"
version = "0.1.0"
description = "Jimssak API and AI module contracts"
requires-python = ">=3.11"
# Listed once in backend/requirements.txt, which the Docker image also installs.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements.txt"] }

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
