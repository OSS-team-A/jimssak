name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  backend-ai:
    name: backend-ai
    runs-on: ubuntu-latest
    services:
      # Backend tests run against PostgreSQL (TEST_DATABASE_URL defaults to this one).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jimssak
          POSTGRES_PASSWORD: jimssak
          POSTGRES_DB: jimssak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jimssak -d jimssak"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,vision]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m ai.pipeline
