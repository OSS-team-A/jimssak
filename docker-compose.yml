# API server only; the frontend is deployed separately.
#   cp backend/.env.example backend/.env   # then fill in the keys and CORS_ORIGINS
#   docker compose up -d --build
services:
  api:
    build: ./backend
    image: jimssak-api
    env_file: ./backend/.env
    # These win over backend/.env, whose relative data paths are for local runs. Keeping
    # the database and videos on the volume is what lets them survive a redeploy.
    environment:
      AUTH_DB_PATH: /data/auth.sqlite3
      MEDIA_DIR: /data/media
    ports:
      - "8000:8000"
    volumes:
      - jimssak-data:/data
    restart: unless-stopped

volumes:
  jimssak-data:
